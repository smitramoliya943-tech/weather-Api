<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="wrapper">

        <!-- Left Section -->

        <div class="left-section">

            <div class="logo">
                WeatherInfo
            </div>

            <div class="weather-box">

                <h1 class="temp">29.1°</h1>

                <div class="city-time">

                    <h2>Rajkot</h2>

                    <p>14:33 - Saturday, 25 7 2026</p>

                </div>

                <div class="condition">

                    <i class="fa-solid fa-cloud-sun"></i>

                    <p>Partly Cloudy</p>

                </div>

            </div>

        </div>

        <div class="sidebar">

            <div class="search-box">

                <input type="text" placeholder="Search Location...">

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

            <div class="city-list">

                <p>Ahmedabad</p>
                <p>Gandhinagar</p>
                <p>Surat</p>
                <p>Vadodara</p>

            </div>

            <hr>

            <h3>Weather Details</h3>

            <div class="details">

                <div>
                    <span>Cloudy</span>
                    <span>75%</span>
                </div>

                <div>
                    <span>Humidity</span>
                    <span>75%</span>
                </div>

                <div>
                    <span>Wind</span>
                    <span>15.8 km/h</span>
                </div>

            </div>

            <hr>

            <div class="footer">
                Created with ❤️ by Smit Ramoliya
            </div>

        </div>

    </div>

    <script>

        document.querySelector('button').onclick = function () {

            let city = document.querySelector('input').value;

            const WEATHER_API = `https://api.weatherapi.com/v1/current.json?key=e26ee2f87b994c98863100552231608&q=${city}`;

            fetch(WEATHER_API)
                .then((res) => res.json())
                .then((data) => {

                    document.querySelector('.temp').innerText = data.current.temp_c + "°";
                    document.querySelector('.city-time h2').innerText = data.location.name;
                    document.querySelector('.city-time p').innerText = data.location.localtime;

                    document.querySelector('.condition p').innerText = data.current.condition.text;
                    document.querySelector('.condition i').className = "fa-solid fa-cloud-sun";

                    document.querySelectorAll('.details div span')[1].innerText = data.current.cloud + "%";
                    document.querySelectorAll('.details div span')[3].innerText = data.current.humidity + "%";
                    document.querySelectorAll('.details div span')[5].innerText = data.current.wind_kph + " km/h";

                    let code = data.current.condition.code;

                    if (code == 900) {

                        document.querySelector(".wrapper").style.background =
                            "url('./images/images (1).jpg') center center / cover no-repeat";

                    }
                    else {

                        document.querySelector(".wrapper").style.background =
                            "url('./images/images (2) (1).jpg') center center / cover no-repeat";

                    }

                    console.log(data);

                })
                .catch(() => {
                    alert("City not found!");
                });

        }

    </script>

</body>

</html>
